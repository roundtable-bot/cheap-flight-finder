name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          python3 -m unittest discover tests -v
          node --test tests/*.test.js
      - name: Generated files are up to date
        run: python3 tools/build.py --check
      - name: Scripts parse
        run: |
          python3 -m py_compile skills/*/scripts/*.py
          for f in skills/*/scripts/*.js; do node --check "$f"; done
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" > /dev/null; done
